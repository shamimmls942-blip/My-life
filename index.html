const STK=()=>{const a=k=>{const d=dayStat(k);return d.tasks>0||d.sec>0};let s=0,d=new Date(TODAY);if(!a(iso(d)))d=addD(d,-1);while(a(iso(d))){s++;d=addD(d,-1)}return s};
const stats=()=>{const tot=S.tasks.length,dn=S.tasks.filter(t=>t.done).length;const sub={};S.tasks.forEach(t=>{(sub[t.s]=sub[t.s]||[0,0])[1]++;if(t.done)sub[t.s][0]++});
const skill=Math.round(CRS.reduce((a,c)=>a+(S.prog[c.id]||0),0)/CRS.length);const rc=CAR.reduce((a,c)=>a+Object.keys(S.road[c.id]||{}).filter(k=>S.road[c.id][k]).length,0),rt=CAR.reduce((a,c)=>a+c.lp.length,0);
const study=pct(dn,tot),career=pct(rc,rt);return{tot,dn,sub,study,skill,career,overall:Math.round((study+skill+career)/3),streak:STK()}};
function hdr(t,s){return `<div class="row sp" style="margin-bottom:14px"><div><h1>${t}</h1>${s?`<div class="sub">${s}</div>`:''}</div></div>`}
const t12=h=>{const [H,M]=h.split(':').map(Number),p=H>=12?'PM':'AM';return ((H%12)||12)+':'+String(M).padStart(2,'0')+' '+p};
const timeRange=t=>{if(!t.at)return '';const [H,M]=t.at.split(':').map(Number),e=(H*60+M+t.m)%1440;return `<b style="color:#067a8f">${t12(t.at)} – ${t12(String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'))}</b> · `};
const byT=(a,b)=>(a.at||'99:99').localeCompare(b.at||'99:99');
function taskRow(t){return `<div class="row" style="padding:9px 0;border-bottom:1px solid rgba(127,160,170,.18)"><button class="ck ${t.done?'on':''}" data-a="tog" data-i="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="Complete ${esc(t.t)}">${ic('check')}</button><div style="flex:1;min-width:0" class="${t.done?'done':''}"><div style="font-size:14px;font-weight:500">${esc(t.t)}</div><div class="sub">${timeRange(t)}${esc(t.s)} · ${t.m} min</div></div>${t.at?`<button data-a="alm" data-i="${t.id}" aria-label="Alarm" aria-pressed="${!!t.al}" class="ico" style="width:34px;height:34px;${t.al?'background:var(--a);color:#032':'opacity:.55'}">${ic('bell')}</button>`:''}${t.at?PB(t):''}<button data-a="edit" data-i="${t.id}" aria-label="Edit" class="ico" style="width:34px;height:34px">${ic('edit')}</button><button data-a="del" data-i="${t.id}" aria-label="Delete" class="ico" style="width:34px;height:34px">${ic('trash')}</button></div>`}
const V={};
V.home=()=>{const s=stats(),td=S.tasks.filter(t=>t.day===TK).sort(byT);return `<div class="hero fb">${MS}<div class="mh hb"><span class="lg">${ic('compass')}</span><div><b class="w1">Path<em>Mate</em></b><small>DREAM • PLAN • ACHIEVE</small></div></div><div class="in"><h1>${esc(S.prof.name.split(' ')[0])} 👋</h1><div style="margin:4px 0 12px;font-size:15px">${tr('tag')}</div><div><button class="btn" data-go="motiv">Keep going ${ic('arr')}</button></div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card row"><div class="ring" style="--p:${s.overall}"><b>${s.overall}%</b></div><div><div style="font-weight:600">Your Progress</div><div class="sub">Study ${s.study}% · Skills ${s.skill}% · Career ${s.career}%</div><div class="row" style="margin-top:6px;gap:6px"><span class="tag">${s.overall>=50?'On Track':'Getting started'}</span><span class="tag">${s.streak}-day streak</span></div></div></div>
<div class="lc"><div class="row sp"><b>Today's Plan</b><span class="sub">${td.filter(t=>t.done).length}/${td.length}</span></div>${td.length?td.map(taskRow).join(''):'<div class="empty">No tasks today.</div>'}<div class="sub" style="margin-top:10px">Studied today: <b>${fh(S.hours[tk()]||0)}</b></div><button class="btn" style="width:100%;margin-top:10px" data-go="plan">View Full Plan</button></div></div>
<div class="card row" style="margin-top:12px"><div class="lvl">${Math.floor(XP(s)/100)+1}</div><div style="flex:1"><div class="row sp"><b>Level ${Math.floor(XP(s)/100)+1}</b><span class="sub">${XP(s)%100}/100 XP</span></div><div class="bar" style="margin-top:8px"><i style="width:${XP(s)%100}%"></i></div><div class="sub" style="margin-top:6px">Earn XP: tasks, lessons, focus sessions</div></div></div><h2>Quick Access</h2><div class="grid g6">${[['career','compass','Career Guidance'],['plan','cal','Study Planner'],['opps','globe','Jobs & Scholarships'],['skills','book','Skills'],['ai','bot','AI Mentor'],['prog','chart','Insights']].map(x=>`<button class="fc q" data-go="${x[0]}" style="--c:${QC[x[0]]}"><div class="fi">${ic(x[1])}</div><b style="font-size:13px">${x[2]}</b></button>`).join('')}</div>
<h2>Recent Achievements</h2><div class="grid g2">${badges(s).slice(0,4).map(b=>`<div class="item ${b.on?'':'dim'}" style="opacity:${b.on?1:.5}"><div class="ico">${ic(b.i)}</div><div><b style="font-size:14px">${b.n}</b><div class="sub">${b.d}</div></div></div>`).join('')}</div>`};
const badges=s=>[{n:'First Task Done',d:'Complete 1 task',on:s.dn>=1,i:'check'},{n:'3-Day Streak',d:'Study 3 days in a row',on:s.streak>=3,i:'flame'},{n:'Task Master',d:'Complete 5 tasks',on:s.dn>=5,i:'star'},{n:'Explorer',d:'Save an opportunity',on:S.opps.length>0,i:'bm'},{n:'Learner',d:'Start a course',on:Object.keys(S.prog).length>0,i:'book'},{n:'Pathfinder',d:'Complete a roadmap step',on:s.career>0,i:'compass'}];
